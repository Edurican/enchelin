spring:
  datasource:
    url: jdbc:tc:postgresql:16:///enchelin-test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1lbmNoZWxpbi1hcHBsaWNhdGlvbi10ZXN0aW5n
  expiration: 3600000

kakao:
  api:
    key: test-kakao-api-key

github:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:8080/api/auth/github/callback

app:
  frontend-url: http://localhost:5173

anthropic:
  api-key: test-key

summary:
  scheduler:
    enabled: false
  model-version: claude-sonnet-4-6
  prompt-version: v1.0.0
